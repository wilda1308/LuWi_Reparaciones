<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparaciones LuWi | Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Mantenido por si necesitas iconos en otro lado, como la lupa) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--Estilos personalizados-->
    <link href="/styles/styleIndex.css" rel="stylesheet">
    <link rel="stylesheet" href= "/styles/otrasPantallas.css">
    <link href = "/Imagenes/logoLUWI.png" rel = "icon">
</head>
<body class="bg-light">
    <header class="text-white px-4 py-3">
        <a href="/index.html" class="navbar-brand text-white fw-bold d-flex align-items-center gap-3 text-decoration-none flex-wrap" id="linkPrincipal">
            <img src="/Imagenes/logoPrincipalLuwi.png" alt="logo LUWI Reparaciones" width="50" height="50" class="rounded-circle object-fit-cover">
            <div>Reparaciones <span class="textNaranjas">LUWI</span></div>
        </a>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="d-flex flex-wrap align-items-center g-">
                            <h1 class="h3 fw-bold mb-1">Iniciar Sesión</h1>
                            <i class="bi bi-box-arrow-in-right fs-1 ms-2"></i>
                        </div>
                        <p class="text-secondary mb-4">Bienvenido de vuelta a Reparaciones LUWI</p>

                        <div id="alerta"></div>

                        <form id="formLogin" novalidate>
                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" name="correo" id="correo" required>
                                <div class="invalid-feedback">Escribe un correo válido</div>
                            </div>
                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" name="contrasena" id="contrasena" required>
                                <div class="invalid-feedback">Escribe tu contraseña.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Entrar</button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            ¿No tienes cuenta? <a href="/pages/registroUser.html" class="enlace-naranja text-decoration-none">Regístrate</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>

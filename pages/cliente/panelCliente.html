<!DOCTYPE html>
<html lang="es-CO">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reparaciones LuWi | Cliente</title>
        <!-- Bootstrap 5 CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons (Mantenido por si necesitas iconos en otro lado, como la lupa) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <!--Estilos personalizados-->
        <link href="/styles/styleIndex.css" rel="stylesheet">
        <link rel="stylesheet" href="/styles/otrasPantallas.css">
        <link href = "/Imagenes/logoLUWI.png" rel = "icon">
    </head>
    <body class="bg-light">
        <!-- Header -->
         <header class="text-white px-4 py-3 d-flex justify-content-between align-items-center">
            <a href="/index.html" class="navbar-brand text-white fw-bold d-flex align-items-center gap-3 text-decoration-none flex-wrap" id="linkPrincipal">
                <img src="/Imagenes/logoPrincipalLuwi.png" alt="logo LUWI Reparaciones" width="50" height="50" class="rounded-circle object-fit-cover">
                <div>Reparaciones <span class="textNaranjas">LUWI</span></div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="d-none d-md-inline">Hola, <strong id="nombreUsuario"></strong></span>
                <button id="btnSalir" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </button>
            </div>
        </header>

        <main class="container py-4" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="h4 fw-bold mb-0">Mis Reparaciones</h2>
                <div class="d-flex gap-2">
                    <button id="btnActualizar" class="btn btn-outline-dark btn-sm fs-6 fw-semibold">
                        <i class="bi bi-arrow-clockwise"></i> Actualizar
                    </button>
                    <button id="btnNuevaReparacion" class="btn btn-primary btn-sm fw-semibold">
                        <i class="bi bi-plus-lg"></i> Publicar reparación
                    </button>
                </div>
            </div>

            <div id="alertaLista"></div>
            <div id="listaReparaciones"></div>
        </main>

        <div class="modal fade" id="modalReparacion" tabindex="-1" aria-labelledby="tituloModalReparacion" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <form class="modal-content" id="formReparacion" novalidate>

                    <div class="modal-header">
                        <h2 class="modal-title h5" id="tituloModalReparacion">Publicar una reparacion</h2>
                        <button type="button" class="btn-close textNaranjas" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <div id="alertaForm"></div>

                        <!-- Título -->
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="titulo" id="titulo" maxlength="120" placeholder="Ej: Nevera no enfría" required>
                            <div class="invalid-feedback">Escribe un título.</div>
                        </div>

                        <!-- Categoría y marca -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                                <select class="form-select" name="categoria" id="categoria" required>
                                    <option value="" selected disabled>Elige una opción</option>
                                    <option>Electrodomésticos</option>
                                    <option>Electrónica</option>
                                    <option>Celulares</option>
                                    <option>Computadores</option>
                                    <option>Muebles</option>
                                    <option>Plomería</option>
                                    <option>Electricidad</option>
                                    <option>Mecánica</option>
                                    <option>Otros</option>
                                </select>
                                <div class="invalid-feedback">Elige una categoría.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="marcaObjeto" class="form-label">Marca <span class="text-secondary">(opcional)</span></label>
                                <input type="text" class="form-control" name="marcaObjeto" id="marcaObjeto" maxlength="100">
                            </div>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">¿Cuál es el daño? <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="descripcion" id="descripcion" rows="3" required></textarea>
                            <div class="invalid-feedback">Describe el daño.</div>
                        </div>

                        <!-- Presupuesto mínimo y máximo -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="presupuestoMinimo" class="form-label">Presupuesto mínimo</label>
                                <input type="number" class="form-control" id="presupuestoMinimo" name="presupuestoMinimo" min="1" placeholder="$ COP">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="presupuestoMaximo" class="form-label">Presupuesto máximo</label>
                                <input type="number" class="form-control" id="presupuestoMaximo" name="presupuestoMaximo" min="1" placeholder="$ COP">
                            </div>
                        </div>

                        <!-- Ubicación (ciudad y zona) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ciudad" class="form-label">Ciudad <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="ciudad" name="ciudad" maxlength="100" required>
                                <div class="invalid-feedback">Escribe la ciudad.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="zona" class="form-label">Zona o barrio <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="zona" name="zona" maxlength="150" required>
                                <div class="invalid-feedback">Escribe la zona.</div>
                            </div>
                        </div>

                        <p class="text-secondary small mb-0">Los campos con <span class="text-danger">*</span> son obligatorios.</p>

                        <div class="modal-footer">
                            <button type="submit" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary fw-semibold">Publicar reparación</button>
                        </div>
                    </div>
                </form>
            </div>     
        </div>

        <!-- Bootstrap 5 JS Bundle CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/api.js"></script>
        <script src="/js/panelCliente.js"></script>
    </body>
</html>
